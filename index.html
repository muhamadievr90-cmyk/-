<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тон — музыка</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0a1a;--bg2:#1a1428;--bg3:#241d35;
  --tx:#f5f0ff;--tx2:#c8bfe0;--mu:#8a7fa8;
  --ac:#ff5c8a;--ac2:#7a4dff;--ac3:#4dc8ff;
  --ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.15);
  --shadow:0 8px 32px rgba(0,0,0,.4);
  --shadow-lg:0 20px 60px rgba(0,0,0,.5);
  --glow:0 0 40px rgba(255,92,138,.3);
}
[data-theme="light"]{
  --bg:#f8f5ff;--bg2:#efe8ff;--bg3:#e5dcf5;
  --tx:#1a1030;--tx2:#4a3d6a;--mu:#7a6d9a;
  --ac:#ff4080;--ac2:#6040ff;--ac3:#20a0e0;
  --ln:rgba(0,0,0,.08);--ln2:rgba(0,0,0,.12);
  --shadow:0 8px 32px rgba(100,80,150,.15);
  --shadow-lg:0 20px 60px rgba(100,80,150,.2);
  --glow:0 0 40px rgba(255,64,128,.2);
}
*{box-sizing:border-box;margin:0}
body{
  background:var(--bg);color:var(--tx);
  font:400 15px/1.5 Manrope,system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 200px;
  transition:background .4s ease,color .4s ease;
  min-height:100vh;
}
h1,h2{font-family:Unbounded,Manrope,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:all .25s ease}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac3);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* Hero */
.hero{
  margin:14px 0 26px;border-radius:32px;
  background:linear-gradient(135deg,var(--bg2) 0%,var(--bg) 100%);
  border:1px solid var(--ln);text-align:center;padding:14px 18px 28px;
  box-shadow:var(--shadow);
  animation:fadeIn .6s ease;
  position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,var(--ac) 0%,transparent 50%);
  opacity:.08;pointer-events:none;
}
canvas{width:100%;height:210px;display:block;border-radius:20px}
.hero h1{font-size:28px;letter-spacing:-.02em;margin-top:12px;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.hero p{color:var(--mu);margin:6px 0 18px;font-size:14px}

/* Wave button */
.wave{
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:#fff;font-weight:700;padding:14px 34px;border-radius:99px;font-size:16px;
  box-shadow:0 10px 30px -8px var(--ac);
  transition:all .3s ease;position:relative;overflow:hidden;
}
.wave::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.2),transparent);
  opacity:0;transition:opacity .3s;
}
.wave:hover{transform:translateY(-2px);box-shadow:0 15px 40px -8px var(--ac)}
.wave:hover::before{opacity:1}
.wave:active{transform:translateY(0)}

/* Moods */
.moods{display:flex;gap:8px;overflow-x:auto;margin-top:18px;padding-bottom:4px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.moods::-webkit-scrollbar{display:none}
.moods button{
  white-space:nowrap;padding:8px 16px;border-radius:99px;
  border:1px solid var(--ln);color:var(--mu);font-weight:600;
  transition:all .25s ease;
}
.moods button:hover{border-color:var(--ln2);color:var(--tx)}
.moods button.on{
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  color:#fff;border-color:transparent;
  box-shadow:0 4px 16px -4px var(--ac);
}

/* Theme toggle */
.theme-toggle{
  position:absolute;top:16px;right:16px;
  width:40px;height:40px;border-radius:50%;
  background:var(--bg3);border:1px solid var(--ln);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:all .3s ease;z-index:2;
}
.theme-toggle:hover{transform:rotate(180deg);background:var(--bg2)}

/* Content */
h2{font-size:18px;margin:8px 0 12px;color:var(--tx)}

/* Track rows */
.row{
  display:flex;align-items:center;gap:13px;padding:10px 12px;
  border-radius:16px;cursor:pointer;
  transition:all .25s ease;
  animation:slideIn .4s ease backwards;
}
.row:nth-child(1){animation-delay:.05s}
.row:nth-child(2){animation-delay:.1s}
.row:nth-child(3){animation-delay:.15s}
.row:nth-child(4){animation-delay:.2s}
.row:nth-child(5){animation-delay:.25s}
.row:hover{background:var(--bg2);transform:translateX(4px)}
.row.cur{background:linear-gradient(135deg,var(--bg2),var(--bg3));box-shadow:inset 0 0 0 1px var(--ac)}

/* Cover */
.cv{flex:none;width:52px;height:52px;border-radius:14px;background:var(--bg3) center/cover;
  transition:transform .3s ease;
}
.row:hover .cv{transform:scale(1.05)}

/* Meta */
.m{flex:1;min-width:0}
.m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.m span{color:var(--mu);font-size:13px}

/* Heart */
.hb{font-size:22px;color:var(--mu);padding:8px;transition:all .25s ease}
.hb:hover{transform:scale(1.2)}
.hb.on{color:var(--ac);animation:pulse .6s ease}

/* Time */
.tm{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}

/* Search */
.sr,.key{
  width:100%;padding:16px 22px;border-radius:99px;
  border:1px solid var(--ln);background:var(--bg2);color:var(--tx);
  font:inherit;margin:14px 0;
  transition:all .3s ease;
}
.sr:focus,.key:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(255,92,138,.15)}

/* Empty */
.empty{color:var(--mu);padding:24px 12px;text-align:center;font-size:14px}

/* Card */
.card{
  background:var(--bg2);border-radius:24px;padding:24px;margin:24px 0;
  border:1px solid var(--ln);box-shadow:var(--shadow);
  animation:fadeIn .5s ease;
}
.card a{color:var(--ac)}

/* Player */
.pl{
  position:fixed;left:10px;right:10px;bottom:calc(60px + env(safe-area-inset-bottom));
  max-width:700px;margin:0 auto;z-index:6;
  border-radius:24px;padding:14px 16px 12px;color:#fff;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  box-shadow:var(--shadow-lg);
  transition:all .4s ease;
  animation:slideUp .5s ease;
}
.pl .t{display:flex;align-items:center;gap:12px}
.pl .cv{width:48px;height:48px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.pl .m span{color:rgba(255,255,255,.85)}
.ct{display:flex;align-items:center}
.ct button{font-size:20px;padding:8px 10px;transition:transform .2s ease}
.ct button:hover{transform:scale(1.15)}
.ct .pp{
  background:#fff;color:var(--bg);border-radius:50%;
  width:48px;height:48px;font-size:18px;padding:0;
  box-shadow:0 4px 16px rgba(0,0,0,.2);
}
.ct .pp:hover{transform:scale(1.1)}
.pg{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;font-variant-numeric:tabular-nums}
.pg input{flex:1;accent-color:#fff;height:4px}

/* Nav */
.nav{
  position:fixed;left:0;right:0;bottom:0;
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--ln);z-index:5;
}
.nav .in{max-width:720px;margin:0 auto;display:flex}
.nav button{
  flex:1;padding:12px 0 10px;color:var(--mu);font-weight:600;font-size:13px;
  transition:color .25s ease;position:relative;
}
.nav button:hover{color:var(--tx)}
.nav button.on{color:var(--tx)}
.nav button::after{
  content:"";display:block;width:20px;height:3px;border-radius:3px;
  margin:5px auto 0;background:transparent;transition:all .3s ease;
}
.nav button.on::after{background:linear-gradient(90deg,var(--ac),var(--ac2));width:28px}

/* Responsive */
@media (max-width:480px){
  .hero h1{font-size:24px}
  .hero p{font-size:13px}
  .wave{padding:12px 28px;font-size:15px}
  .row{padding:8px 10px;gap:10px}
  .cv{width:46px;height:46px}
  .pl{left:8px;right:8px;padding:12px 14px 10px}
  .pl .cv{width:42px;height:42px}
}
@media (min-width:768px){
  .hero h1{font-size:32px}
  .row{padding:12px 16px}
}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Loading */
.loading{display:inline-block;width:20px;height:20px;border:2px solid var(--ln);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero" id="hero">
    <button class="theme-toggle" id="themeBtn" aria-label="Сменить тему">🌙</button>
    <canvas id="cv" width="640" height="420"></canvas>
    <h1>Моя волна</h1>
    <p id="sub">Легальная музыка независимых артистов со всего мира</p>
    <button class="wave" id="waveBtn">Включить волну</button>
    <div class="moods" id="moods"></div>
  </section>
  <div id="view"></div>
</div>

<div class="pl" id="pl">
  <div class="t">
    <div class="cv" id="pcv"></div>
    <div class="m"><b id="pt">Ничего не играет</b><span id="pa">Выберите трек</span></div>
    <button class="hb" id="plike" style="color:#fff" aria-label="В любимое">♡</button>
    <div class="ct"><button id="prev" aria-label="Назад">⏮</button><button class="pp" id="pp" aria-label="Играть">▶</button><button id="next" aria-label="Вперёд">⏭</button></div>
  </div>
  <div class="pg"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка"><span id="dur">0:00</span></div>
</div>

<nav class="nav"><div class="in">
  <button data-v="home" class="on">Главное</button><button data-v="search">Поиск</button><button data-v="fav">Любимое</button>
</div></nav>

<script>
const CLIENT_ID = "";
const API = "https://api.jamendo.com/v3.0/tracks/";
const MOODS = {"Все":"","Бодрость":"energetic","Фокус":"ambient","Расслабление":"relaxing","Ночь":"lounge","Рок":"rock","Электроника":"electronic","Джаз":"jazz","Классика":"classical","Хип-хоп":"hiphop","Инди":"indie","Метал":"metal","Фолк":"folk","Поп":"pop"};
const au = new Audio();
const $ = id => document.getElementById(id);
const fmt = s => isFinite(s) ? Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0") : "0:00";
const ls = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };

let key = CLIENT_ID || ls.get("ton-key",""), mood = "Все", view = "home", list = [], queue = [], cur = -1, radio = false, favs = ls.get("ton-favs",{});

// Theme
let theme = ls.get("ton-theme", "dark");
document.documentElement.setAttribute("data-theme", theme);
$("themeBtn").textContent = theme === "dark" ? "🌙" : "☀️";
$("themeBtn").onclick = () => {
  theme = theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", theme);
  $("themeBtn").textContent = theme === "dark" ? "🌙" : "☀️";
  ls.set("ton-theme", theme);
};

async function load(params){
  if(!key) return [];
  const q = new URLSearchParams({client_id:key,format:"json",limit:40,imagesize:200,audioformat:"mp31",...params});
  const r = await fetch(API+"?"+q);
  const j = await r.json();
  if(j.headers && j.headers.status !== "success") throw new Error(j.headers.error_message || "Ошибка API");
  return j.results.filter(t=>t.audio).map(t=>({id:t.id,t:t.name,a:t.artist_name,img:t.image,src:t.audio,d:+t.duration||0}));
}
const feed = () => load({order:"popularity_week", ...(MOODS[mood]?{tags:MOODS[mood]}:{})});

function rows(arr){
  if(!arr.length) return '<p class="empty">Ничего не найдено. Попробуйте другой запрос.</p>';
  return arr.map((x,i)=>`<div class="row ${queue[cur]&&queue[cur].id===x.id?"cur":""}" data-i="${i}" tabindex="0" role="button"><div class="cv" style="background-image:url('${x.img}')"></div><div class="m"><b>${esc(x.t)}</b><span>${esc(x.a)}</span></div><span class="tm">${fmt(x.d)}</span><button class="hb ${favs[x.id]?"on":""}" data-like="${i}" aria-label="В любимое">${favs[x.id]?"♥":"♡"}</button></div>`).join("");
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

async function render(){
  $("hero").style.display = view==="home" ? "" : "none";
  const v = $("view");
  if(!key){
    v.innerHTML = '<div class="card"><h2>Подключите каталог</h2><p style="margin:8px 0 4px">Нужен бесплатный ключ Jamendo (client_id). Получите его на <a href="https://devportal.jamendo.com" target="_blank" rel="noopener">devportal.jamendo.com</a> и вставьте сюда.</p><input class="key" id="k" placeholder="Например, 1a2b3c4d" autocomplete="off"><button class="wave" id="ks">Сохранить ключ</button></div>';
    $("ks").onclick = () => { const k=$("k").value.trim(); if(k){key=k;ls.set("ton-key",k);render()} };
    return;
  }
  if(view==="home"){
    v.innerHTML = '<h2>'+(mood==="Все"?"Популярное на этой неделе":mood)+'</h2><p class="empty"><span class="loading"></span></p>';
    try{ list = await feed(); }catch(e){ v.innerHTML='<p class="empty">Не удалось загрузить каталог: '+esc(e.message)+'. Проверьте ключ и интернет.</p>'; return }
    v.innerHTML = '<h2>'+(mood==="Все"?"Популярное на этой неделе":mood)+'</h2>'+rows(list);
  } else if(view==="search"){
    v.innerHTML = '<input class="sr" id="q" type="search" placeholder="Трек, исполнитель, жанр" autocomplete="off"><div id="res"><p class="empty">Начните вводить название или имя артиста.</p></div>';
    let t; $("q").oninput = e => { clearTimeout(t); const s=e.target.value.trim(); t=setTimeout(async()=>{ if(!s) return; try{ list=await load({search:s,order:"relevance"}); $("res").innerHTML=rows(list) }catch(err){ $("res").innerHTML='<p class="empty">Ошибка поиска: '+esc(err.message)+'</p>' } },350) };
  } else {
    list = Object.values(favs);
    v.innerHTML = '<h2>Любимое</h2>'+(list.length?rows(list):'<p class="empty">Нажмите ♡ у трека — он появится здесь.</p>');
  }
}

function play(i, from){
  if(from) queue = from;
  cur = i; const x = queue[cur];
  au.src = x.src; au.play().catch(()=>{});
  $("pt").textContent = x.t; $("pa").textContent = x.a + (radio?" · Моя волна":"");
  $("pcv").style.backgroundImage = `url('${x.img}')`; $("dur").textContent = fmt(x.d);
  $("plike").textContent = favs[x.id]?"♥":"♡";
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("cur",queue[+r.dataset.i]&&queue[+r.dataset.i].id===x.id&&queue===list));
  if("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({title:x.t,artist:x.a,artwork:[{src:x.img,sizes:"200x200"}]});
}
function step(d){ if(!queue.length) return; play(radio ? Math.floor(Math.random()*queue.length) : (cur+d+queue.length)%queue.length) }
function toggleLike(x){ favs[x.id]?delete favs[x.id]:favs[x.id]=x; ls.set("ton-favs",favs); }

au.onplay = au.onpause = () => { $("pp").textContent = au.paused?"▶":"❚❚"; $("waveBtn").textContent = radio&&!au.paused?"Пауза":"Включить волну" };
au.ontimeupdate = () => { $("cur").textContent=fmt(au.currentTime); if(au.duration){ $("seek").value=au.currentTime/au.duration*1000; $("dur").textContent=fmt(au.duration) } };
au.onended = () => step(1);
au.onerror = () => { if(queue.length>1) step(1) };
$("seek").oninput = e => { if(au.duration) au.currentTime = e.target.value/1000*au.duration };
$("pp").onclick = () => { if(cur<0){ if(list.length) play(0,list) } else au.paused?au.play():au.pause() };
$("next").onclick = () => step(1); $("prev").onclick = () => step(-1);
$("plike").onclick = () => { if(cur<0) return; toggleLike(queue[cur]); $("plike").textContent=favs[queue[cur].id]?"♥":"♡"; if(view==="fav") render() };
$("waveBtn").onclick = async () => {
  if(radio && cur>=0){ au.paused?au.play():au.pause(); return }
  if(!key) return render();
  radio = true; try{ const pool = list.length?list:await feed(); list = pool; play(Math.floor(Math.random()*pool.length), pool) }catch{}
};
document.addEventListener("click", e => {
  const l = e.target.closest("[data-like]");
  if(l){ toggleLike(list[+l.dataset.like]); render(); return }
  const r = e.target.closest(".row");
  if(r){ radio=false; play(+r.dataset.i, list) }
});
document.addEventListener("keydown", e => { if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("row")){ e.preventDefault(); e.target.click() } });
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => { view=b.dataset.v; document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x===b)); render(); scrollTo(0,0) });
$("moods").innerHTML = Object.keys(MOODS).map(m=>`<button class="${m===mood?"on":""}">${m}</button>`).join("");
$("moods").onclick = e => { const b=e.target.closest("button"); if(!b) return; mood=b.textContent; radio=false; list=[]; $("moods").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); render() };

/* Визуализатор */
const c=$("cv"),g=c.getContext("2d");let ph=0,amp=0;
(function draw(){
  requestAnimationFrame(draw); if(view!=="home") return;
  const W=c.width,H=c.height; g.clearRect(0,0,W,H);
  const on=!au.paused; ph+=on?.02:.005; amp+=((on?1:.2)-amp)*.05;
  const hue = cur>=0 ? (parseInt(queue[cur].id,10)*47)%360 : 335;
  const beat = on ? (Math.sin(ph*9)*.5+.5)*.4 : 0;
  for(let k=3;k>=0;k--){
    g.beginPath();
    for(let i=0;i<=96;i++){
      const t=i/96*Math.PI*2, r=88+beat*22+k*15+Math.sin(t*3+ph*2+k)*(5+amp*18)+Math.cos(t*5-ph)*(3+amp*9);
      const px=W/2+Math.cos(t)*r*1.35, py=H/2+Math.sin(t)*r*.92; i?g.lineTo(px,py):g.moveTo(px,py);
    }
    g.closePath(); g.fillStyle=`hsla(${(hue+k*22)%360},90%,62%,${k===0?.95:.13})`; g.fill();
  }
})();
render();
</script>
</body>
</html>
